name: Backend CI

on:
  push:
    branches: [ main ]
    paths: [ 'demo-backend/**' ]
  pull_request:
    paths: [ 'demo-backend/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: demo-backend
        run: mvn -B test
