server:
  port: 8083

spring:
  application:
    name: demo-order-service

  datasource:
    url: jdbc:h2:mem:rca-demo-order;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

supplier:
  base-url: ${SUPPLIER_BASE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        # RCA 排查用：健康检查 / 指标 / 线程栈 / 堆转储 / 动态日志级别
        include: health,info,metrics,threaddump,heapdump,loggers
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
